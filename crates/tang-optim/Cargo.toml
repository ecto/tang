[package]
name = "tang-optim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Optimization algorithms — Adam, L-BFGS, Newton, Levenberg-Marquardt"
repository.workspace = true
readme = "README.md"
keywords = ["optimization", "adam", "lbfgs", "newton", "math"]
categories = ["mathematics", "science", "algorithms"]
include = ["src/**/*", "README.md"]

[features]
default = []
# Reassociable float ops in hot reductions. Requires Rust 1.98+.
algebraic = ["tang/algebraic", "tang-la/algebraic"]

[dependencies]
tang = { workspace = true }
tang-la = { workspace = true }
tang-ad = { workspace = true }

[dev-dependencies]
approx = "0.5"
