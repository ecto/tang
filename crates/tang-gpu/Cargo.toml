[package]
name = "tang-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPU compute runtime for tang-expr — fused forward-backward kernels via wgpu"
repository.workspace = true
readme = "README.md"
keywords = ["gpu", "wgpu", "compute", "kernel", "machine-learning"]
categories = ["graphics", "science", "hardware-support"]
include = ["src/**/*", "README.md", "examples/**/*"]

[dependencies]
tang = { workspace = true }
tang-expr = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
safetensors = { workspace = true }
# tensor-IR programs (`program::Program`)
tang-compile = { workspace = true }
# CPU runtime (`cpu::CpuProgram`): dlopen the compiled C
libloading = "0.8"
# CUDA backend: the driver and nvrtc are loaded at run time, so the
# feature builds (and the binary runs, falling back to wgpu) on machines
# without NVIDIA hardware or a CUDA toolkit.
cudarc = { version = "0.16", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12080"], optional = true }

[features]
default = []
cuda = ["dep:cudarc"]

[[example]]
name = "physics_surrogate"

[[example]]
name = "quantum_poet"

[dev-dependencies]
approx = "0.5"
# the physics_surrogate example trains on the CPU first
tang-tensor = { workspace = true }
tang-train = { workspace = true }
