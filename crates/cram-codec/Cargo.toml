[package]
name = "cram-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Error-bounded scientific-data compression: bit-accounted quantized tensor train (QTT) codec"
repository.workspace = true
homepage = "https://cram.sh"
documentation = "https://docs.rs/cram-codec"
readme = "README.md"
keywords = ["compression", "tensor-train", "qtt", "scientific-data", "lossy"]
categories = ["compression", "science", "mathematics"]
include = ["src/**/*", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "SHIPPED_DECODER.md", "examples/**/*"]

[dependencies]
tang-la = { workspace = true }
tang-optim = { workspace = true }
# integer dialect: the learned-MLP GPU kernel and its CPU reference
tang-expr = { workspace = true }
# Blocked symmetric eigensolver (tang-la already bridges faer 0.24 behind a
# feature). No rayon: the codec is single threaded by design.
faer = { version = "0.24", default-features = false, features = ["std"] }
# GPU decoder for the tc-gpu stream (hand-written WGSL kernels).
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

# Lossless container arms (`container` feature). Native only: zstd and xz2
# wrap C libraries that do not build for wasm32-unknown-unknown.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { workspace = true, optional = true }
xz2 = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# std::time::Instant panics on wasm32-unknown-unknown
web-time = "1.1"

[features]
default = ["container"]
# `container::{compress, decompress}` and the `cram` binary (native only)
container = ["dep:zstd", "dep:xz2", "dep:brotli", "dep:crc32fast"]
gpu = ["dep:wgpu", "dep:pollster"]

[[bin]]
name = "cram"
path = "src/bin/cram.rs"
required-features = ["container"]

[dev-dependencies]
