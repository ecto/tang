[package]
name = "tang-compute"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native GPU compute backends via tang-expr multi-target codegen"
repository.workspace = true
readme = "README.md"
keywords = ["gpu", "metal", "cuda", "compute", "codegen"]
categories = ["hardware-support", "science"]
include = ["src/**/*", "README.md", "build.rs"]

[features]
default = []
metal = ["dep:metal", "dep:objc"]
cuda = ["dep:cudarc"]

[dependencies]
tang = { workspace = true, features = ["std"] }
tang-expr = { workspace = true }
bytemuck = { workspace = true }
metal = { version = "0.33", optional = true }
objc = { version = "0.2", optional = true }
cudarc = { version = "0.16", features = ["nvrtc", "cublas", "cuda-version-from-build-system"], optional = true }

[build-dependencies]
