[package]
name = "tang-site-wasm"
version = "0.1.0"
edition = "2021"
# a cdylib for the tang.rs site, not a library crate
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tang = { workspace = true }
tang-tensor = { workspace = true }
tang-train = { workspace = true }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
