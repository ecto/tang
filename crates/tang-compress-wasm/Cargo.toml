[package]
name = "tang-compress-wasm"
version = "0.1.0"
edition = "2021"
# wasm-bindgen front end for the tang-compress TCG1/TCG3 decoders (WebGPU + CPU)
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tang-compress = { workspace = true, features = ["gpu"] }
wgpu = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
