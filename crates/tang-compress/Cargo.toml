[package]
name = "tang-compress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Error-bounded scientific-data compression: bit-accounted quantized tensor train (QTT) codec"
repository.workspace = true
readme = "README.md"
keywords = ["compression", "tensor-train", "qtt", "scientific-data", "lossy"]
categories = ["compression", "science", "mathematics"]
include = ["src/**/*", "README.md", "examples/**/*"]

[dependencies]
tang-la = { workspace = true }
# Blocked symmetric eigensolver (tang-la already bridges faer 0.24 behind a
# feature). No rayon: the codec is single threaded by design.
faer = { version = "0.24", default-features = false, features = ["std"] }

[dev-dependencies]
