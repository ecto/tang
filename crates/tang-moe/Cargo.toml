[package]
name = "tang-moe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Offloaded MoE runtime substrate: pinned host arena, VRAM expert cache, pointer table"
repository.workspace = true
readme = "README.md"
keywords = ["moe", "cuda", "inference", "offload"]
categories = ["science"]
include = ["src/**/*", "README.md", "DESIGN.md"]

[features]
default = []
cuda = ["dep:cudarc"]
# NCCL collectives (src/nccl.rs). cudarc loads libnccl at run time, so this builds without it;
# only creating a `Comm` needs libnccl.so.2 present.
nccl = ["cuda", "cudarc/nccl"]

[dependencies]
libc = "0.2"
cudarc = { version = "0.16", features = ["nvrtc", "cuda-version-from-build-system"], optional = true }

[[bin]]
name = "tang-moe-bench"
required-features = ["cuda"]
