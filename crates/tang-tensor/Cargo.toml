[package]
name = "tang-tensor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "N-dimensional arrays with CPU and GPU backends"
repository.workspace = true
readme = "README.md"
keywords = ["tensor", "ndarray", "machine-learning", "gpu"]
categories = ["mathematics", "science"]
include = ["src/**/*", "README.md"]

[dependencies]
tang = { workspace = true }
tang-la = { workspace = true }
[features]
default = []
accelerate = ["tang-la/accelerate"]
threads = ["tang-la/threads"]
# Reassociable float ops in hot reductions. Requires Rust 1.98+.
algebraic = ["tang/algebraic", "tang-la/algebraic"]

[dev-dependencies]
approx = "0.5"
