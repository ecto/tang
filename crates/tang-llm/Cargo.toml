[package]
name = "tang-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LLM inference on tang-compute: Qwen3-family models, KV cache, sampling, chat templates"
repository.workspace = true
keywords = ["llm", "inference", "metal", "qwen"]
categories = ["science"]
publish = false

[features]
default = []
metal = ["tang-compute/metal"]
# NVIDIA GPUs. On Linux, build with `--no-default-features --features cuda` (Metal is macOS-only).
cuda = ["tang-compute/cuda"]

[dependencies]
tang-compute = { workspace = true }
safetensors = { workspace = true }
tokenizers = { workspace = true }
serde = { workspace = true }
serde_json = "1"
memmap2 = "0.9"
anyhow = "1"
minijinja = { version = "2", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
axum = "0.8"
tokio = { workspace = true }
tokio-stream = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"

[[example]]
name = "bench_ops"
required-features = ["metal"]

[[example]]
name = "bench_prefill"
required-features = ["metal"]
