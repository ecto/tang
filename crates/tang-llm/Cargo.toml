[package]
name = "tang-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LLM inference on tang-compute: Qwen3-family models, KV cache, sampling, chat templates"
repository.workspace = true
keywords = ["llm", "inference", "metal", "qwen"]
categories = ["science"]
readme = "README.md"
include = ["src/**/*", "README.md", "CUDA.md", "docs/**/*"]

[features]
default = []
metal = ["tang-compute/metal"]
# NVIDIA GPUs. On Linux, build with `--no-default-features --features cuda` (Metal is macOS-only).
cuda = ["tang-compute/cuda", "dep:tang-moe", "tang-moe/cuda", "dep:cudarc"]

# OpenTelemetry traces and metrics over OTLP/HTTP (see docs/observability.md). Off by default.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

mtp-train = ["dep:tang-ad", "dep:tang-train", "dep:tang-tensor"]

[dependencies]
tang-compute = { workspace = true }
tang-compress = { workspace = true }
tang-ad = { workspace = true, optional = true }
tang-train = { workspace = true, optional = true }
tang-tensor = { workspace = true, optional = true }
safetensors = { workspace = true }
tokenizers = { workspace = true }
serde = { workspace = true }
serde_json = "1"
memmap2 = "0.9"
anyhow = "1"
rayon = "1"
minijinja = { version = "2", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
axum = "0.8"
tokio = { workspace = true }
tokio-stream = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
# Fetching https `image_url`s (rustls; no native TLS).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
llguidance = { version = "=1.9.1", default-features = false }
libc = "0.2"
tang-moe = { workspace = true, optional = true }
opentelemetry = { version = "0.30", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.30", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "metrics"], optional = true }
cudarc = { version = "0.16", features = ["nvrtc", "cuda-version-from-build-system"], optional = true }

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[[example]]
name = "bench_ops"
required-features = ["metal"]

[[example]]
name = "bench_batch"

[[example]]
name = "bench_prefill"
required-features = ["metal"]

[[example]]
name = "kvcomp_bench"
required-features = ["metal"]
