[package]
name = "tang-expr"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RISC expression graph for symbolic computation, differentiation, and compilation"
repository.workspace = true
readme = "README.md"
keywords = ["expression", "symbolic", "graph", "codegen", "autodiff"]
categories = ["mathematics", "science", "compilers"]
include = ["src/**/*", "README.md", "examples/**/*"]

[dependencies]
tang = { workspace = true, features = ["std"] }

[dev-dependencies]
# validates the integer dialect's WGSL (same naga as the workspace wgpu)
naga = { version = "25", features = ["wgsl-in"] }

[[example]]
name = "symbolic_regression"
