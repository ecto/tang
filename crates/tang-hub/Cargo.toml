[package]
name = "tang-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HuggingFace Hub model download and loading"
repository.workspace = true
readme = "README.md"
keywords = ["huggingface", "models", "download", "tensor"]
categories = ["api-bindings", "science"]
include = ["src/**/*", "README.md"]

[dependencies]
tang = { workspace = true }
tang-la = { workspace = true }
tang-tensor = { workspace = true }
tang-safetensors = { workspace = true }
hf-hub = "0.3"

[features]
default = []
tokenizers = ["dep:tokenizers"]

[dependencies.tokenizers]
version = "0.21"
optional = true

[dev-dependencies]
tempfile = "3"
