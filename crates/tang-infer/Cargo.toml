[package]
name = "tang-infer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Inference runtime: KV-cache, sampling strategies, autoregressive generation"
repository.workspace = true
readme = "README.md"
keywords = ["inference", "llm", "kv-cache", "sampling"]
categories = ["science", "algorithms"]
include = ["src/**/*", "README.md"]

[features]
default = []
# Reassociable float ops in hot reductions. Requires Rust 1.98+.
algebraic = ["tang/algebraic", "tang-tensor/algebraic", "tang-train/algebraic"]
threads = ["tang-tensor/threads", "tang-train/threads"]

[dependencies]
tang = { workspace = true }
tang-tensor = { workspace = true }
tang-train = { workspace = true }
