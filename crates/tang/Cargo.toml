[package]
name = "tang"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ecto/tang"
description = "Math library for physical reality — geometry, spatial algebra, tensor, training, GPU compute, and 3D gaussian splatting"

[features]
default = ["std"]
std = []
bytemuck = ["dep:bytemuck"]
serde = ["dep:serde"]
exact = ["dep:robust", "std"]
libm = ["dep:libm"]
# Reassociable float ops (algebraic_add/mul) in hot reductions. Requires Rust 1.98+.
#
# WARNING: cargo features are additive and global. If ANY crate in the build
# graph enables `tang/algebraic`, it is on for every tang consumer in that
# build — you cannot opt out locally. Results then differ from a strict build by
# ~1 ulp per element in reductions (dot, norm, sum). Don't enable it in a build
# that has a pinned numeric baseline.
#
# It is deliberately NOT mutually exclusive with `exact`: consumers such as vcad
# legitimately want exact predicates for boolean geometry *and* fast solvers in
# the same build. Order-sensitive code is kept safe by never calling the alg_*
# ops, enforced by crates/tang/tests/algebraic_forbidden.rs.
algebraic = []

# Extended modules
la = ["std"]
ad = ["la"]
expr = ["std"]
gpu = ["expr", "dep:wgpu", "dep:pollster", "dep:safetensors-crate", "bytemuck"]
compute = ["expr", "bytemuck"]
metal = ["compute", "dep:metal", "dep:objc"]
cuda = ["compute", "dep:cudarc"]
tensor = ["la"]
optim = ["la", "ad"]
train = ["la", "ad", "tensor", "optim"]
safetensors = ["la", "tensor", "dep:safetensors-crate"]
splatting = ["gpu", "expr", "tensor", "dep:wgpu", "bytemuck", "dep:pollster"]
holo = ["splatting", "tensor", "dep:image"]
accelerate = ["la", "dep:faer"]
# Multi-core GEMM via rayon. Off by default: tang is no_std-first.
threads = ["la", "std", "dep:rayon"]

[dependencies]
# Core (always)
paste = "1"

rayon = { version = "1", optional = true }

# Optional core
bytemuck = { version = "1.14", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
robust = { version = "1.1", optional = true }
libm = { version = "0.2", optional = true }

# la
faer = { version = "0.20", optional = true }

# gpu / splatting
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
safetensors-crate = { package = "safetensors", version = "0.4", optional = true }

# compute
metal = { version = "0.31", optional = true }
objc = { version = "0.2", optional = true }
cudarc = { version = "0.12", features = ["nvrtc", "cublas", "cuda-version-from-build-system"], optional = true }

# holo
image = { version = "0.25", optional = true }

[dev-dependencies]
approx = "0.5"
