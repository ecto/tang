[package]
name = "tang-otel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenTelemetry setup shared by tang crates: OTLP/JSON lines to a file by default, OTLP/HTTP only when asked"
repository.workspace = true
# internal plumbing behind the `otel` features of tang-gpu, tang-bench and tang-llm
publish = false

[dependencies]
opentelemetry = { version = "0.30", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.30", default-features = false, features = ["trace", "metrics"] }
opentelemetry-proto = { version = "0.30", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "with-serde"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "metrics"] }
serde_json = "1"
serde = "1"
