[package]
name = "tang-train"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Computational graph, parameter management, training loop"

[features]
accelerate = ["tang-la/accelerate", "tang-tensor/accelerate"]
# Reassociable float ops in hot reductions. Requires Rust 1.98+.
algebraic = [
    "tang/algebraic",
    "tang-la/algebraic",
    "tang-tensor/algebraic",
    "tang-optim/algebraic",
]

[dependencies]
tang = { workspace = true }
tang-la = { workspace = true }
tang-ad = { workspace = true }
tang-tensor = { workspace = true }
tang-optim = { workspace = true }

[[example]]
name = "quantum_poet"

[[example]]
name = "pinn_poisson"

[dev-dependencies]
approx = "0.5"

[[example]]
name = "smollm"
