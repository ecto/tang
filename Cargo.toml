[workspace]
resolver = "2"
members = [
    "crates/tang",
    "crates/tang-la",
    "crates/tang-ad",
    "crates/tang-sparse",
    "crates/tang-gpu",
    "crates/tang-tensor",
    "crates/tang-optim",
    "crates/tang-train",
    "crates/tang-safetensors",
    "crates/tang-hub",
    "crates/tang-bench",
    "crates/tang-site-wasm",
    "crates/tang-expr",
    "crates/tang-mesh",
    "crates/tang-infer",
    "crates/tang-onnx",
    "crates/tang-compile",
    "crates/tang-compute",
    "crates/tang-3dgs",
    "crates/tang-holo",
    "crates/tang-sheffer",
    "crates/tang-sheffer-wasm",
    "crates/tang-llm",
    "crates/tang-otel",
    "crates/tang-moe",
    "crates/tang-verify",
    "crates/tang-llm-ios",
    "crates/cram-codec",
    "crates/cram-codec-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecto/tang"
# CI builds on 1.94.1 (.github/workflows); that is the MSRV we promise.
rust-version = "1.94"
authors = ["Cam Pedersen <cam@campedersen.com>"]

# Released (docs/publishing.md). crates.io before this commit: tang 0.2.0,
# tang-la 0.1.0, tang-ad 0.1.0, tang-expr 0.1.0. Everything else unpublished.
#   tang        0.2.1   (additive since the 0.2.0 commit f82c629: the
#                        `algebraic` feature, SIMD stats moments, row-major
#                        GEMM. No breaking change found.)
#   tang-la     0.1.1   (algebraic reductions, eigensolver fix)
#   tang-ad     0.1.1
#   tang-expr   0.1.1
#   tang-tensor / tang-gpu / tang-train / tang-3dgs
#               0.1.0, first publish — they take [workspace.package] version.
#   tang-optim  0.1.1   (crates.io: 0.1.0, 0.1.1)
# Next release (docs/publishing.md, "crates.io readiness"):
#   tang-expr     0.2.0 (integer dialect `int`, `reverse`, `split`; the
#                        `CompiledMany` alias gained `Send + Sync` and
#                        abs/min/max/tanh lower to different graphs, so a
#                        0.x minor bump, not 0.1.2)
#   tang-compile  0.1.0 first publish
#   cram-codec 0.1.0 first publish
# tang-la, tang-ad and tang-expr carry their own `version` because they moved
# off the workspace number. Publish in the order in docs/publishing.md
# (scripts/publish.sh).

[workspace.dependencies]
tang = { version = "0.2", path = "crates/tang" }
tang-la = { version = "0.1", path = "crates/tang-la" }
tang-ad = { version = "0.1", path = "crates/tang-ad" }
tang-sparse = { version = "0.1", path = "crates/tang-sparse" }
tang-gpu = { version = "0.1", path = "crates/tang-gpu" }
tang-tensor = { version = "0.1", path = "crates/tang-tensor" }
tang-optim = { version = "0.1", path = "crates/tang-optim" }
tang-train = { version = "0.1", path = "crates/tang-train" }
tang-safetensors = { version = "0.1", path = "crates/tang-safetensors" }
tang-hub = { version = "0.1", path = "crates/tang-hub" }
tang-expr = { version = "0.2", path = "crates/tang-expr" }
tang-mesh = { version = "0.1", path = "crates/tang-mesh" }
tang-infer = { version = "0.1", path = "crates/tang-infer" }
tang-onnx = { version = "0.1", path = "crates/tang-onnx" }
tang-compile = { version = "0.1", path = "crates/tang-compile" }
tang-compute = { version = "0.1", path = "crates/tang-compute" }
tang-3dgs = { version = "0.1", path = "crates/tang-3dgs" }
tang-holo = { version = "0.1", path = "crates/tang-holo" }
tang-sheffer = { version = "0.1", path = "crates/tang-sheffer" }
tang-llm = { version = "0.1", path = "crates/tang-llm" }
tang-otel = { version = "0.1", path = "crates/tang-otel" }
cram-codec = { version = "0.1", path = "crates/cram-codec" }
# cram-codec `container` arms (all MIT / Apache-2.0 / BSD)
zstd = "0.13"
xz2 = "0.1"
brotli = "8"
crc32fast = "1"
tang-moe = { version = "0.1", path = "crates/tang-moe" }
tang-verify = { version = "0.1", path = "crates/tang-verify" }
iroh = "0.96"
tarpc = { version = "0.35", features = ["tokio1", "serde-transport"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
tracing = "0.1"
wgpu = "25"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.4"
safetensors = "0.4"
tokenizers = "0.21"
